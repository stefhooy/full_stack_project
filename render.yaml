# Render Blueprint for the backend. Illustrative reference for the env vars
# and settings a working deploy needs — the actual Slice 19 deploy used
# Render's manual "New Web Service" form instead of importing this file as
# a Blueprint, so it hasn't itself been exercised end to end, but every
# value below matches what the real deploy used (see README.md's
# "Deploying" section for the live URLs and DOCEXP.md's Slice 19 entry).
#
# Fly.io was considered instead of Render and ruled out: it removed its
# free tier for new accounts in 2024 (a 2 VM hour/7 day trial, then a
# credit card is required), while Render's free web service tier still
# needs no card. Use Render.
services:
  - type: web
    name: ai-game-analyst-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MODEL_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # set manually in the Render dashboard — never commit real keys
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_PROVIDER
        value: local
      - key: LANGSMITH_TRACING
        value: "false" # set true + LANGSMITH_API_KEY (sync: false) once you want tracing live
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://full-stack-project-sepia-nine.vercel.app
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
