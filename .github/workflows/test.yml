name: Tests

# Runs on every push/PR, unlike the other two workflows here (those are
# scheduled data-collection jobs, not CI) -- this is the one that actually
# gates on "does the code still work": ruff (lint), mypy (types), then
# pytest (Slice 11's test suite). Deliberately does NOT need real secrets
# (GROQ_API_KEY etc.): every test that runs by default is against a pure
# function or a real, throwaway on-disk DuckDB fixture, never a live
# LLM/network call (those are marked `live` and excluded by default -- see
# pyproject.toml's [tool.pytest.ini_options]). ruff/mypy's own config lives
# in pyproject.toml's [tool.ruff]/[tool.mypy] (Slice 21), not duplicated
# here.

on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {} # manual runs from the Actions tab -- e.g. to
    # re-verify a workflow-file-only fix. Without this, "Re-run jobs" on
    # an old run replays the workflow *definition* pinned to that run's
    # original commit, not whatever is now on master -- a real, confirmed
    # GitHub Actions gotcha (see DOCEXP.md's Slice 35/36 entries, found
    # in frontend-ci.yml and run_evals.yml respectively). Added here too
    # so this workflow -- the one that actually gates every push/PR --
    # doesn't sit as the one instance of the same trap nobody happened to
    # rediscover yet.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Needs --extra agent too, not just base + dev: src/tools/stats_tool.py
      # and forecast_tool.py import numpy/scipy, which live in the "agent"
      # extra (see pyproject.toml) even though these specific tests never
      # touch the LLM/LangChain parts of that extra -- scipy/numpy just
      # weren't worth a fourth dependency group for two modules.
      - name: Install dependencies
        run: uv sync --extra agent --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest -v
