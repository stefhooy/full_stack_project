name: Refresh catalog (trigger backend redeploy)

# Answers the "will the SteamSpy catalog ever refresh?" question directly:
# yes, by periodically rebuilding and redeploying the backend, since the
# Dockerfile runs ingestion at *build* time (see DOCEXP.md's Slice 6 and 7
# entries). This workflow doesn't touch data itself -- it just pokes the
# host's deploy hook, which triggers a fresh Docker build, which re-runs
# `python -m src.ingestion.ingest` against SteamSpy's live (always-current)
# API.
#
# No-ops cleanly (green checkmark, not a failure) until DEPLOY_HOOK_URL is
# set -- add it as a repo secret once you've actually deployed (Render and
# Fly.io both provide a deploy-hook URL in their dashboards) to turn this
# on.
#
# Daily as of Slice 40, not weekly: this is the ONLY thing that ever
# rebuilds the backend, and player_counts (Slice 7) shares this same
# trigger with the catalog -- weekly meant the live site's forecast tool
# could lag the real accumulated snapshot history by up to 7 days, which
# is exactly what surfaced this (a live forecast using 8 snapshots when
# 30+ already existed). Deliberately not matched to
# poll_player_counts.yml's own 6-hour cadence: each rebuild is a real
# Docker build (~20-30 min of Render's own build-pipeline minutes, an
# undisclosed monthly free-tier allowance that bills you for overage,
# unlike GitHub Actions minutes on this public repo, which are free and
# unlimited). Daily keeps that cost real and small (~30 min/day) while
# still closing the staleness window from a week down to at most a day.

on:
  schedule:
    - cron: "0 4 * * *" # daily, 04:00 UTC
  workflow_dispatch: {}

jobs:
  trigger-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend redeploy via deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "DEPLOY_HOOK_URL secret not set yet -- nothing to do."
            echo "Add it (Settings > Secrets and variables > Actions) once the"
            echo "backend is deployed -- see the README's Deploying section."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"
