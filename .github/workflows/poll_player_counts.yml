name: Poll player counts

# Runs on a schedule, not on push -- this is a data-collection job, not CI.
# Every run captures a moment in time that can never be recovered later
# (Steam's live-player-count API has no history endpoint), so the
# resulting snapshot gets committed straight back to the repo. See
# src/ingestion/poll_player_counts.py and DOCEXP.md's Slice 7 entry for
# why this is split from build_player_counts_table.py.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to commit the snapshot back to the repo

concurrency:
  group: poll-player-counts
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Base dependency set only (no --extra agent) -- these scripts never
      # import src.agent, so the LLM/RAG stack isn't needed here. See the
      # split explained in pyproject.toml.
      - name: Install dependencies
        run: uv sync

      # poll_player_counts.py gets its appid list directly from SteamSpy's
      # own cheap bulk listing (one request, no per-game rate limit) --
      # no local catalog needs building first. Used to run the *full*
      # ingest.py here (both APIs' per-game enrichment loops) just to
      # learn appids this script never used any other field of -- ~40
      # real minutes of wasted work every 6 hours, and the direct cause
      # of runs queuing up behind each other. See DOCEXP.md's Slice 29
      # entry. As a side effect, going straight to SteamSpy here still
      # means the appid list stays current as new games enter the
      # top-owned list, without any separate scheduled refresh job.
      - name: Poll live player counts
        run: uv run python -m src.ingestion.poll_player_counts

      - name: Commit the new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/player_counts_raw/
          git diff --cached --quiet || git commit -m "Poll player counts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
