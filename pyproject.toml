[project]
name = "ai-game-analyst"
version = "0.1.0"
description = "A tool-using AI agent that answers plain-English questions about the video game market."
requires-python = ">=3.12"
dependencies = [
    # The lean set: everything src/ingestion/, src/db/, and src/config.py
    # need. Nothing here imports src.agent, so this alone is enough for
    # ingestion scripts and the scheduled GitHub Actions jobs -- they never
    # need the LLM/RAG stack. This was requirements-ingestion.txt before
    # the pyproject.toml migration; now it's just the base dependency set,
    # and the "agent" extra below is what requirements.txt used to add on
    # top of it.
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "sqlglot>=25.0.0",
    "truststore>=0.10.0",
]

[project.optional-dependencies]
# Everything src/agent/, src/tools/, src/evals/, and src/api/ need on top
# of the base set: the LLM/RAG/API stack. `uv sync --extra agent` for
# local dev and the deployed backend; plain `uv sync` (base only) for the
# ingestion-only GitHub Actions jobs, matching the CI-lean vs. full-app
# split that used to be two separate requirements*.txt files.
agent = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",
    "langchain-groq>=0.2.3",
    "langchain-ollama>=0.2.2",
    "langsmith>=0.2.0",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    # Slice 8: src/mcp_server/server.py exposes run_sql/run_stats over MCP.
    # Bundled into "agent" rather than a separate extra -- it already reuses
    # src.tools (which imports langchain_core) and src.agent.rag (schema
    # resource), so a standalone extra would barely be leaner in practice,
    # not worth the extra complexity of explaining a third dependency group.
    "mcp[cli]>=2.0.0",
]

# Test tooling only — never needed to run ingestion or the agent/API, so
# it's its own extra rather than folded into "agent". Deliberately an
# extra (needs `--extra dev`), not a `[dependency-groups]` entry, even
# though that's the more modern place for dev-only tooling in general:
# dependency-groups install by *default* on a bare `uv sync`, which would
# quietly reintroduce the exact "bare uv sync scope" confusion this
# project already got bitten by once for the `agent` extra (see
# DOCEXP.md) — one consistent "nothing extra installs without an explicit
# --extra" rule beats using the technically-more-correct mechanism here.
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, the real correctness baseline. I: import
# sorting. UP: modern-Python idioms (this targets 3.12, no reason to write
# 3.8-compatible code). B: flake8-bugbear, catches real bug patterns (mutable
# default args, a bare `except Exception:` -- BLE001 specifically, which
# src/api/main.py was already writing `# noqa: BLE001` comments against
# before this config existed, so enabling it just makes an intent that was
# already in the code enforced rather than aspirational). RUF: ruff's own
# checks (e.g. an unpacked tuple element that's never used, a real bug in
# two places this caught for real).
#
# Deliberately NOT enabling DTZ (flake8-datetimez, "always pass tzinfo"):
# this codebase has one consistent, intentional convention instead --
# timestamps are written UTC-aware at the one point they're created
# (`poll_player_counts.py`'s `datetime.now(timezone.utc)`) and read back
# naive everywhere else, matching what DuckDB's Python API actually returns
# for a TIMESTAMP column. Enabling DTZ would flag every naive datetime in
# tests/forecast_tool.py as a bug when it's actually the tool correctly
# matching its one real data source, not an oversight.
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# _strip_dashes() (src/agent/graph.py) and its test both work by containing
# literal em dash/en dash/non-breaking-hyphen characters in source -- that's
# not stray unusual punctuation, it's the exact set of characters the
# function exists to strip. Ruff's ambiguous-unicode checks (RUF001/2/3)
# would otherwise flag the one place in the repo where these characters are
# supposed to appear literally.
"src/agent/graph.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_graph_dash_stripping.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["src"]
# Not full strict mode: this codebase leans on LangChain/LangGraph/DuckDB,
# none of which ship complete type stubs, and forcing --strict on day one
# would mean either a wall of `# type: ignore` on library boundaries or
# hours spent stub-hunting instead of catching real bugs. Start at a level
# that catches real mistakes (wrong return type, unreachable code, missing
# return) without fighting untyped third-party surfaces, and tighten later
# once the untyped-library boundaries are individually silenced instead of
# ignored wholesale.
warn_return_any = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.uv]
# This is an application (imported via `from src.x import y`, run as
# `python -m src.x.y` from the repo root), not a distributable library --
# nothing under src/ is meant to be built into a wheel. Tells uv to manage
# the venv/dependencies only, not try to build-and-install this project's
# own code as a package.
package = false

# Some environments (e.g. Windows machines with AV software like Avast
# doing TLS interception) re-sign HTTPS traffic with a locally-installed
# root CA that the OS trusts but bundled certificate stores don't -- hit
# this repeatedly on the Python side (see the truststore usage/comment in
# src/config.py) and again here with uv's own Rust TLS stack. This is the
# uv-side equivalent: use the OS trust store instead of uv's bundled one.
native-tls = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, `uv run pytest` (the console-script entry point) can't
# import `src` -- pytest's console script never adds the project root to
# sys.path, only `python -m pytest` does that (its `-m` puts cwd on
# sys.path[0]). This is pytest's built-in fix (since 7.0), so plain
# `pytest`/`uv run pytest` and `python -m pytest` both work identically --
# found for real when `uv run pytest -v` (as written in README/CI) raised
# `ModuleNotFoundError: No module named 'src'` on a fresh shell.
pythonpath = ["."]
# Tests that hit a real Groq/Ollama call or a live network API are opt-in
# (marked "live"), excluded by default -- `pytest -m live` to run only
# those, `pytest -m "" ` (or unset addopts) to include everything. Everything
# that runs by default is against pure functions or a real, throwaway
# on-disk DuckDB fixture -- never a mock of this project's own code.
addopts = "-m 'not live'"
markers = ["live: hits a real network API, run explicitly with -m live"]
